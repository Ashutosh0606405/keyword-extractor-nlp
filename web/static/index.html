<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeySense NLP - Intelligent Keyword & Keyphrase Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #818cf8;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --badge-border: rgba(56, 189, 248, 0.4);
      --highlight-bg: rgba(250, 204, 21, 0.25);
      --highlight-border: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #0f172a;
      font-size: 1.1rem;
    }
    .brand-title {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f8fafc, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      background: rgba(129, 140, 248, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.3);
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    main {
      flex: 1;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .preset-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .pill-btn {
      background: rgba(51, 65, 85, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn:hover {
      color: var(--text);
      background: #334155;
      border-color: #475569;
    }
    textarea {
      width: 100%;
      min-height: 240px;
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      line-height: 1.6;
      transition: border-color 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    select, input[type="range"] {
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      font-size: 0.88rem;
    }
    select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #0ea5e9);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.35);
    }
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .keyword-item {
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .keyword-item:hover {
      border-color: var(--primary);
      background: #111a2e;
    }
    .keyword-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .keyword-text {
      font-weight: 600;
      font-size: 1rem;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .keyword-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .method-tag {
      background: rgba(129, 140, 248, 0.15);
      color: #c7d2fe;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.7rem;
    }
    .keyword-score {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      min-width: 90px;
    }
    .score-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--primary);
    }
    .score-bar-bg {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 9999px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #818cf8, #38bdf8);
      border-radius: 9999px;
    }
    .highlighted-box {
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.9rem;
      line-height: 1.8;
      max-height: 260px;
      overflow-y: auto;
      color: #cbd5e1;
    }
    .highlight-mark {
      background: var(--highlight-bg);
      color: #fef08a;
      border-bottom: 2px solid var(--highlight-border);
      padding: 0.1rem 0.25rem;
      border-radius: 3px;
      font-weight: 600;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--text);
      background: #334155;
    }
    .stats-row {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .stat-pill {
      background: #0b1120;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }
    .stat-pill strong { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">K</div>
      <div>
        <div class="brand-title">KeySense NLP</div>
      </div>
      <span class="brand-badge">Multi-Method Engine</span>
    </div>
    <div class="stats-row">
      <div class="stat-pill">Models: <strong>Ensemble, TF-IDF, RAKE, TextRank, YAKE, Semantic</strong></div>
    </div>
  </header>

  <main>
    <!-- Left Column: Input and Configuration -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">Document Input</h2>
        <div class="preset-pills">
          <span style="font-size: 0.75rem; color: var(--text-muted); align-self: center;">Samples:</span>
          <button class="pill-btn" onclick="loadSample('ai')">AI Transformers</button>
          <button class="pill-btn" onclick="loadSample('crispr')">Biotech CRISPR</button>
          <button class="pill-btn" onclick="loadSample('cloud')">Cloud Computing</button>
        </div>
      </div>

      <textarea id="inputText" placeholder="Paste your article, abstract, or research text here to extract key terms..."></textarea>

      <div class="controls-grid">
        <div class="control-group">
          <label for="methodSelect">Algorithm</label>
          <select id="methodSelect">
            <option value="ensemble" selected>Ensemble (Hybrid Fusion)</option>
            <option value="positionrank">PositionRank (Graph)</option>
            <option value="textrank">TextRank (Graph)</option>
            <option value="yake">YAKE (Statistical)</option>
            <option value="rake">RAKE (Co-occurrence)</option>
            <option value="semantic">Semantic MMR (Embeddings)</option>
            <option value="tfidf">TF-IDF (Statistical)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Top Keywords: <span id="topKVal" style="color: var(--primary);">10</span></label>
          <input type="range" id="topKSlider" min="3" max="30" value="10" oninput="document.getElementById('topKVal').innerText = this.value">
        </div>

        <div class="control-group">
          <label for="ngramSelect">N-Gram Size</label>
          <select id="ngramSelect">
            <option value="1-2" selected>Unigrams & Bigrams (1-2)</option>
            <option value="1-3">1 to 3 words</option>
            <option value="1-1">Unigrams only (1)</option>
            <option value="2-3">Phrases only (2-3)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Diversity: <span id="divVal" style="color: var(--accent);">0.50</span></label>
          <input type="range" id="diversitySlider" min="0" max="1" step="0.05" value="0.5" oninput="document.getElementById('divVal').innerText = parseFloat(this.value).toFixed(2)">
        </div>
      </div>

      <button class="btn-primary" onclick="extractKeywords()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        Extract Keywords
      </button>
    </section>

    <!-- Right Column: Results & Interactive Visualization -->
    <section class="card">
      <div class="tab-bar">
        <button class="tab-btn active" id="tabListBtn" onclick="switchTab('list')">Ranked Keywords</button>
        <button class="tab-btn" id="tabHighlightBtn" onclick="switchTab('highlight')">In-Text Highlighter</button>
        <button class="tab-btn" id="tabJsonBtn" onclick="switchTab('json')">JSON View</button>
      </div>

      <!-- Tab 1: Keyword List -->
      <div id="listView">
        <div id="resultsList" class="results-container">
          <div class="empty-state">
            Click "Extract Keywords" to discover key phrases and concepts.
          </div>
        </div>
      </div>

      <!-- Tab 2: In-Text Highlighter -->
      <div id="highlightView" style="display: none;">
        <div class="highlighted-box" id="highlightContent">
          No keywords extracted yet.
        </div>
      </div>

      <!-- Tab 3: JSON View -->
      <div id="jsonView" style="display: none;">
        <textarea id="jsonContent" readonly style="min-height: 480px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;"></textarea>
      </div>
    </section>
  </main>

  <script>
    const SAMPLES = {
      ai: `The dominant sequence transduction models are based on complex recurrent or convolutional neural networks in an encoder-decoder configuration. The best performing models also connect the encoder and decoder through an attention mechanism. We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely. Experiments on two machine translation tasks show these models to be superior in quality while being more parallelizable and requiring significantly less time to train.`,
      crispr: `CRISPR-Cas9 is a revolutionary genome editing technology adapted from a bacterial defense system. The system utilizes a single guide RNA molecule that directs the Cas9 endonuclease enzyme to introduce double-strand breaks at specific targeted DNA sequences. Subsequent cellular repair mechanisms, including non-homologous end joining and homology-directed repair, enable targeted gene knockouts, precise sequence insertions, or transcriptional modifications. CRISPR applications have expanded rapidly across genetic disease therapeutics, crop biotechnology, and functional genomics screening.`,
      cloud: `Cloud computing architectures provide on-demand access to scalable computing resources, storage infrastructure, and managed databases over the internet with pay-as-you-go pricing. Container orchestration platforms such as Kubernetes automate deployment, scaling, and operational management of microservices across distributed multi-cloud clusters. Serverless functions abstract underlying server provisioning, executing application code strictly in response to event triggers and automatically scaling from zero to thousands of concurrent requests.`
    };

    function loadSample(key) {
      document.getElementById('inputText').value = SAMPLES[key] || '';
    }

    // Load initial sample
    loadSample('ai');

    let currentResults = [];

    async function extractKeywords() {
      const text = document.getElementById('inputText').value.trim();
      if (!text) {
        alert("Please enter some text first.");
        return;
      }

      const method = document.getElementById('methodSelect').value;
      const topK = parseInt(document.getElementById('topKSlider').value, 10);
      const ngramVal = document.getElementById('ngramSelect').value.split('-').map(Number);
      const diversity = parseFloat(document.getElementById('diversitySlider').value);

      const payload = {
        text: text,
        method: method,
        top_k: topK,
        ngram_range: ngramVal,
        diversity: diversity
      };

      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = `<div class="empty-state">Extracting keywords using ${method}...</div>`;

      try {
        const response = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        currentResults = data.keywords || [];
        renderResults(currentResults, text);
      } catch (err) {
        resultsList.innerHTML = `<div class="empty-state" style="color: #f87171;">Failed to connect to backend: ${err.message}</div>`;
      }
    }

    function renderResults(keywords, rawText) {
      const listEl = document.getElementById('resultsList');
      if (!keywords.length) {
        listEl.innerHTML = `<div class="empty-state">No keywords found for the given criteria.</div>`;
        return;
      }

      let html = '';
      keywords.forEach((item, idx) => {
        const pct = Math.round(item.score * 100);
        const methodTag = item.metadata && item.metadata.supporting_methods 
          ? `<span class="method-tag">${item.metadata.supporting_methods.length} Votes</span>` 
          : `<span class="method-tag">${item.metadata?.method || 'Extractor'}</span>`;

        html += `
          <div class="keyword-item">
            <div class="keyword-info">
              <div class="keyword-text">
                <span style="color: var(--text-muted); font-size: 0.8rem; min-width: 20px;">#${idx + 1}</span>
                ${item.keyword}
              </div>
              <div class="keyword-meta">
                <span>Freq: <strong>${item.frequency}</strong></span>
                <span>N-gram: <strong>${item.ngram_size}</strong></span>
                ${methodTag}
              </div>
            </div>
            <div class="keyword-score">
              <span class="score-val">${item.score.toFixed(3)}</span>
              <div class="score-bar-bg">
                <div class="score-bar-fill" style="width: ${pct}%"></div>
              </div>
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;

      // Update JSON view
      document.getElementById('jsonContent').value = JSON.stringify(keywords, null, 2);

      // Update Highlighter
      renderHighlighter(rawText, keywords);
    }

    function renderHighlighter(text, keywords) {
      if (!keywords.length) return;
      // Sort phrases longest first so longer phrases get highlighted first
      const phrases = keywords.map(k => k.keyword).sort((a, b) => b.length - a.length);
      const pattern = new RegExp(`\\b(${phrases.map(escapeRegExp).join('|')})\\b`, 'gi');
      const highlighted = text.replace(pattern, match => `<mark class="highlight-mark">${match}</mark>`);
      document.getElementById('highlightContent').innerHTML = highlighted;
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function switchTab(tab) {
      document.getElementById('listView').style.display = tab === 'list' ? 'block' : 'none';
      document.getElementById('highlightView').style.display = tab === 'highlight' ? 'block' : 'none';
      document.getElementById('jsonView').style.display = tab === 'json' ? 'block' : 'none';

      document.getElementById('tabListBtn').classList.toggle('active', tab === 'list');
      document.getElementById('tabHighlightBtn').classList.toggle('active', tab === 'highlight');
      document.getElementById('tabJsonBtn').classList.toggle('active', tab === 'json');
    }
  </script>
</body>
</html>
